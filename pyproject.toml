[project]
name = "nbaeg"
version = "0.1.0"
description = "NBA end game: estimated inputs, exact end-game game, decision maps (JDSSV paper)"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=16",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "matplotlib>=3.9",
  "numba>=0.60",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
